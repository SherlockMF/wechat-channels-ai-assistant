<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>Windows 用户说明</title>
  <style>
    body { font-family: "Microsoft YaHei", sans-serif; max-width: 720px; margin: 40px auto; padding: 0 20px; line-height: 1.7; }
    .big { font-size: 20px; font-weight: 800; }
    .step { background: #f5f5f5; padding: 16px; border-radius: 12px; margin: 12px 0; }
  </style>
</head>
<body>
  <h1>Windows：从解压到使用</h1>
  <div class="step">
    <p class="big">1. 解压 zip，把「视频号内容诊断助手」整个文件夹复制到桌面</p>
  </div>
  <div class="step">
    <p class="big">2. 打开桌面上的文件夹，双击「一键启动.bat」</p>
    <p>若提示「已保护你的电脑」→ 更多信息 → 仍要运行</p>
  </div>
  <div class="step">
    <p class="big">3. 黑窗口不要关，等待浏览器打开</p>
    <p>也可手动打开：http://localhost:3000</p>
  </div>
  <div class="step">
    <p class="big">4. 网页右上角齿轮 → 填写 API Key → 保存</p>
  </div>
  <p>更完整说明请打开文件夹里的 <strong>README-使用说明.md</strong>（可用记事本打开）。</p>
  <p>下次：再双击「一键启动.bat」即可。</p>
</body>
</html>
